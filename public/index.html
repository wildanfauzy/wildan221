<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Genshin Impact — Wildan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 id="site-title">⚔️ Collab Genshin</h1>
      <p id="site-tagline">Ikut collab bareng Wildan!</p>
    </div>
  </header>

  <!-- ===== Showcase karakter (pajangan) ===== -->
  <section class="showcase" id="showcase">
    <div class="sec-head">
      <h2>Pilih Karaktermu</h2>
      <p>Tap salah satu karakter untuk melihat infonya</p>
    </div>
    <div class="region-tabs" id="region-tabs"></div>
    <div class="char-grid" id="char-grid"></div>
  </section>

  <main>
    <!-- ===== Form collab ===== -->
    <section class="card" id="form-section">
      <h2>Daftar Ikut Collab</h2>
      <p class="sub" id="form-sub">Isi data dan kirim fotomu 🚀</p>
      <form id="collab-form" novalidate>
        <!-- field dinamis global akan dirender lewat JS -->
        <div id="global-fields"></div>

        <div class="char-blocks" id="char-blocks"></div>

        <div class="add-char-row">
          <button type="button" id="add-char-btn" class="btn-ghost">＋ Tambah karakter</button>
        </div>

        <p class="error-msg" id="form-error" hidden></p>
        <button type="submit" id="submit-btn">Kirim 🚀</button>
      </form>
      <p class="hint" id="form-hint"></p>
    </section>

    <!-- ===== Galeri peserta ===== -->
    <section class="card" id="gallery-section">
      <h2>Yang Sudah Daftar</h2>
      <div class="region-filter" id="gallery-filter"></div>
      <div id="gallery" class="gallery"><p class="loading">Memuat...</p></div>
    </section>
  </main>

  <footer>© 2026 Wildan · Fan collab Genshin Impact</footer>

  <!-- Modal info karakter -->
  <div class="modal" id="char-modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Tutup">✕</button>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Lightbox gambar -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="Tutup">✕</button>
    <img id="lb-img" alt="Foto">
  </div>

  <script src="app.js"></script>
</body>
</html>
